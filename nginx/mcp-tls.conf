# mcp-tls.conf
# Host side config file, volume mounted into the nginx container.
# TLS terminates here. All packets past here stay plain HTTP when they route to the MCP Server via the internal docker network.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/mcp.crt
    ssl_certificate_key /etc/nginx/tls/mcp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location /mcp {
        proxy_pass http://mcp-server-remote:9000
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
